[workspace]
channels = ["conda-forge"]
name = "CleanPose"
platforms = [
    { platform = "linux-64", glibc = "2.31" }
]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.10.*"
setuptools = ">=80,<82"
wheel = ">=0.48.0,<0.49"
ninja = ">=1.13.2,<2"
packaging = ">=26.3,<27"
numpy = "2.1.*"
scipy = "1.15.*"
matplotlib = ">=3.10.9,<4"
pillow = ">=12.3.0,<13"

[pypi-dependencies]
torch = { version = "==2.12.1", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "==0.27.1", index = "https://download.pytorch.org/whl/cu130" }
gorilla-core = "==0.2.5.3"
opencv-python = "==4.10.0.84"
timm = "==0.9.16"
easydict = ">=1.13, <2"
pyyaml = ">=6.0.3, <7"
scikit-learn = ">=1.7.2, <2"
tensorboardx = ">=2.6.5, <3"
tqdm = ">=4.70.1, <5"
knn-cuda = { url = "https://github.com/altaykacan/KNN_CUDA_reborn/releases/download/0.2/KNN_CUDA-0.2-py3-none-any.whl" }
gdown = ">=6, <7"
open3d = "==0.19.0"
einops = ">=0.6, <1"
tensorboard = ">=2.21.0, <3"
